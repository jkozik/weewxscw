# weectl import config: cleaned Florida Cumulus 1 monthly logs -> weewxscw
# Source files are produced by clean_cumulus.py (~/cumulus-import-scw/clean)
source = Cumulus

[Cumulus]
    directory = /cumulus
    separator = '/'
    delimiter = ','
    decimal = '.'
    # Cumulus logged every 10 minutes (the Envoy uses 15; each record keeps its own)
    interval = 10
    qc = True
    calc_missing = True
    # cleaned files leave bad readings blank; import those as missing
    ignore_invalid_data = True
    tranche = 250
    UV_sensor = False
    solar_sensor = False

    [[FieldMap]]
        [[[dateTime]]]
            source_field = datetime
            unit = unix_epoch
        [[[outTemp]]]
            source_field = cur_out_temp
            unit = degree_F
        [[[inTemp]]]
            source_field = cur_in_temp
            unit = degree_F
        [[[outHumidity]]]
            source_field = cur_out_hum
            unit = percent
        [[[inHumidity]]]
            source_field = cur_in_hum
            unit = percent
        [[[dewpoint]]]
            source_field = cur_dewpoint
            unit = degree_F
        [[[heatindex]]]
            source_field = cur_heatindex
            unit = degree_F
        [[[windchill]]]
            source_field = cur_windchill
            unit = degree_F
        [[[appTemp]]]
            source_field = cur_app_temp
            unit = degree_F
        [[[barometer]]]
            source_field = cur_slp
            unit = inHg
        [[[rain]]]
            source_field = midnight_rain
            unit = inch
            is_cumulative = True
        [[[rainRate]]]
            source_field = cur_rain_rate
            unit = inch_per_hour
        [[[windSpeed]]]
            source_field = avg_wind_speed
            unit = mile_per_hour
        [[[windDir]]]
            source_field = avg_wind_bearing
            unit = degree_compass
        [[[windGust]]]
            source_field = gust_wind_speed
            unit = mile_per_hour
