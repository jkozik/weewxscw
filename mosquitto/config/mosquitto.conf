# mosquitto-scw: Naperville broker for weewxscw live data.
# weewx publishes weather/scw/loop here; the Florida broker on osprey
# dials in over Tailscale (bridge) and subscribes. Host port 1884
# (1883 is weewxrtlsdr's broker). No anonymous access. acl and passwd are
# installed (owner 1883, mode 600) by mosquitto/setup.sh from mosquitto/acl and
# ~/secrets/weewxscw-mqtt.txt.
persistence true
persistence_location /mosquitto/data/
log_dest stdout
log_type error
log_type warning
log_type notice
log_type information
connection_messages true

listener 1883
allow_anonymous false
password_file /mosquitto/config/passwd
acl_file /mosquitto/config/acl
